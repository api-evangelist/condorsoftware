name: Condorsoftware
description: >-
  Condor Software builds AI-powered financial intelligence software for life sciences R&D
  organizations, unifying clinical, operational, and financial data to manage complex clinical
  trial finances. The platform connects data from existing systems (CROs, ERP, CTMS, EDC,
  procurement), automates AI-powered accruals, invoice reconciliation, and financial close, and
  delivers board-ready forecasts, scenario planning, and portfolio dashboards for pharmaceutical,
  biotech, and medical device companies. Condor advertises 90%+ forecast accuracy, faster
  month-end close versus spreadsheets, and a compliance-by-design architecture co-developed with
  Big 4 accounting firms. No public API, developer portal, or SDKs are published at this time;
  integrations with systems such as Veeva, Medidata, SAP, and Oracle NetSuite are delivered
  through the product. Backed by Felicis; raised a $24M Series A.
